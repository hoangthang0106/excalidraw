# IT-MANAGER: Excalidraw one-container Portainer deployment.
# Host and container must both use 18896. Verify the host port is free.
# The official Excalidraw Docker image serves static files with nginx on port 80;
# this command changes the *actual nginx listener* to 18896 before nginx starts.
# LAN-only deployment. No Caddy, collaboration backend, or extra services.
services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    mem_limit: 256m

    ports:
      - "${LAN_IP:?SET_DOCKER_HOST_LAN_IP}:18896:18896/tcp"

    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sed -i \
          -e 's/listen[[:space:]]*80;/listen 18896;/g' \
          -e 's/listen[[:space:]]*\[::\]:80;/listen [::]:18896;/g' \
          /etc/nginx/conf.d/default.conf
        grep -Eq 'listen[[:space:]]+18896;' /etc/nginx/conf.d/default.conf
        nginx -t
        exec nginx -g 'daemon off;'

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18896/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
